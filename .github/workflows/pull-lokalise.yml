name: Pull locales from Lokalise
on:
  workflow_dispatch:
  # TODO: RIMUOVERE PRIMA DEL MERGE IN develop - il pull di norma e' solo workflow_dispatch,
  # ma workflow_dispatch non e' lanciabile finche' il file non e' sul branch di default.
  # Questo trigger push serve solo per testare la action sul branch di feature..
  push:
    branches:
      - feature/PN-19913
    paths:
      - '.github/workflows/pull-lokalise.yml'
concurrency:
  group: lokalise-pull-${{ github.head_ref || github.run_id }}
  cancel-in-progress: false
permissions:
  contents: write
  pull-requests: write
jobs:
  pull-locales:
    runs-on: ubuntu-latest
    # TODO: RIPRISTINARE PRIMA DEL MERGE - usa i secret di repository durante il test.
    #       Riallineare a io-app con "environment: lokalise" quando l'environment sara' disponibile.
    # environment: lokalise
    steps:
    - name: Checkout Repo
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - name: Pull from Lokalise
      uses: lokalise/lokalise-pull-action@70a1a7afde662b154275af1a124f3a21345b3fcf #v5.2.1
      with:
        api_token: ${{ secrets.LOKALISE_API_TOKEN }}
        project_id: ${{ secrets.LOKALISE_PROJECT_ID }}
        translations_path: |
          templates-assets/locales
        base_lang: it
        file_format: json
        always_pull_base: true
        pr_title: "chore: Update translations from Lokalise"
        git_user_name: "github-actions[bot]"
        git_user_email: "github-actions[bot]@users.noreply.github.com"
        additional_params: |
          indentation: 2sp
          # NB: verificare gestione dei placeholder FreeMarker ${...} (vedi push-lokalise.yml)
          placeholder_format: i18n
          filter_langs:
            - it
            - en
            - fr
            - de
            - sl
          replace_breaks: false
          add_newline_eof: true